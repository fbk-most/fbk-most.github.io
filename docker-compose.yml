services:
  web:
    build: .
    container_name: most-website

    ports:
      - "4000:4000"

    volumes:
      - .:/app
      - venv:/app/.venv

    environment:
      PYTHONPATH: /app

    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "4000", "--reload"]

    restart: unless-stopped

volumes:
  venv: